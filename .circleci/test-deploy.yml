version: 2.1
orbs:
  # Your orb will be automatically injected here during the pipeline.
  # Reference your orb's jobs and commands below as they will exist when built.
  orb-tools: circleci/orb-tools@12.3
  # The orb definition is intentionally not included here. It will be injected into the pipeline.
  configurations: {}
  node: circleci/node@7.2.1

# This continuation is the single definition of the orb's integration test
# jobs. The ci pipeline (pull request events only) runs it as-is and ends in
# a dev:<SHA1> publish. The release pipeline (pushes to main) reuses the same
# jobs: .circleci/scripts/build-release-config.sh takes this file, drops the
# dev publish below, and adds the release job from release-workflow.yml.
# Neither pipeline runs on tags; the anchor only keeps job entries uniform.
filters: &filters
  tags:
    only: /.*/

# The cdkd version test_install_cdkd expects the install_cdkd command to
# install by default. It must equal the command's default `version`
# parameter (src/commands/install_cdkd.yml); the test fails if they drift.
cdkd-test-version: &cdkd_test_version "0.280.15"

jobs:
  # Exercise the orb's executors directly, so a packaging or parameter
  # regression in either one fails test-deploy before publish.
  test_base_pinned_executor:
    executor: configurations/base_pinned
    steps:
      - checkout
      - run:
          name: Confirm base_pinned resolves to a cimg/base image
          command: cat /etc/os-release | head -2
      - run:
          # cimg/base does not ship the `circleci` CLI on PATH. What the
          # deploy-marker commands actually depend on is the build-agent
          # CLI CircleCI injects into every job at /usr/bin/circleci (see
          # the migration source's .circleci/continue-config.yml and
          # workflows/deployment/cloudflare-workers.yaml, both of which
          # call it by full path on cimg-family images in production).
          # Check that full path instead of PATH resolution, plus a
          # baseline tool (git) that base_pinned jobs also rely on.
          name: Confirm build-agent circleci CLI and git are present
          command: |
            test -x /usr/bin/circleci
            git --version
  test_trivy_executor:
    executor: configurations/trivy
    steps:
      - checkout
      - run:
          name: Confirm trivy resolves to a working Trivy image
          command: trivy --version
  # Exercise the dependency_audit scripts and the audit_deps command without
  # real credentials: a stubbed `pnpm` stands in for the package manager, and
  # the Chunk fix script is run through its "skip without tokens" path.
  test_dependency_audit:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: Prepare a stubbed pnpm fixture
          command: |
            mkdir -p "$HOME/stubbin"
            printf '#!/usr/bin/env bash\necho "[stub] $0 $*"\nexit 0\n' > "$HOME/stubbin/pnpm"
            chmod +x "$HOME/stubbin/pnpm"
            printf 'export PATH="$HOME/stubbin:$PATH"\n' >> "$BASH_ENV"
            printf '{"name":"fixture","packageManager":"pnpm@10.0.0"}\n' > package.json
            touch pnpm-lock.yaml
      # Runs src/scripts/audit_deps.sh through the packed orb: must detect
      # pnpm from the fixture lockfile and invoke the stubbed `pnpm audit`.
      - configurations/audit_deps:
          audit_level: high
      - run:
          name: chunk_audit_fix.sh skips when tokens are absent
          command: |
            unset CIRCLE_TOKEN GITHUB_TOKEN
            bash src/scripts/chunk_audit_fix.sh
            grep -q 'CHUNK_AUDIT_FIX_SUMMARY' "$BASH_ENV"
  # Command-test for install_cdkd: run it with its default (pinned) version
  # -- no `version` override, so a change to the command's default that is
  # not mirrored in cdkd_test_version fails here -- and assert
  # `cdkd --version` reports exactly that version (not merely a prefix of
  # it — "0.280.150" must fail this check).
  test_install_cdkd:
    executor:
      name: node/default
      tag: "22.14"
    steps:
      - configurations/install_cdkd
      - run:
          name: Assert cdkd --version reports exactly the pinned version
          environment:
            EXPECTED_CDKD_VERSION: *cdkd_test_version
          command: |
            actual="$(cdkd --version)"
            test "${actual}" = "${EXPECTED_CDKD_VERSION}"
  # Exercises the create_github_release command end-to-end without ever
  # creating a real GitHub Release: a `gh` stub is installed at the front
  # of PATH before the command runs, so `gh release view` / `gh release
  # create` never leave this job. RELEASE_TAG is set at the job level so
  # the command's default tag_env (RELEASE_TAG) resolves it; no
  # RELEASE_NOTES_SOURCE / PREV_RELEASE_TAG is set, so this drives the
  # command's first-release branch (--generate-notes, no start tag).
  # skip_if_exists's halt path and the two other release-notes branches
  # are covered by src/tests/create_github_release.bats.
  test_create_github_release:
    executor: configurations/base_pinned
    environment:
      RELEASE_TAG: "2026.09.03-0000000"
    steps:
      - checkout
      - run:
          name: Install a gh stub ahead of PATH (no real Release is ever created)
          command: |
            mkdir -p /tmp/gh-stub-bin
            {
              echo '#!/usr/bin/env bash'
              echo 'if [ "$1" = "release" ] && [ "$2" = "view" ]; then'
              echo '  echo "gh stub: release view $3 -> not found" >&2'
              echo '  exit 1'
              echo 'fi'
              echo 'if [ "$1" = "release" ] && [ "$2" = "create" ]; then'
              echo '  echo "gh stub: release create called with: $*" >&2'
              echo '  echo "$*" > /tmp/gh-release-create-args'
              echo '  exit 0'
              echo 'fi'
              echo 'echo "gh stub: unexpected invocation: $*" >&2'
              echo 'exit 1'
            } > /tmp/gh-stub-bin/gh
            chmod +x /tmp/gh-stub-bin/gh
            echo 'export PATH="/tmp/gh-stub-bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Confirm the stubbed gh (not a real gh binary) is first on PATH
          command: |
            command -v gh
            [ "$(command -v gh)" = "/tmp/gh-stub-bin/gh" ]
      - configurations/create_github_release:
          skip_if_exists: false
      - run:
          name: Assert the stub recorded a first-release "gh release create --generate-notes"
          command: |
            test -f /tmp/gh-release-create-args
            grep -q -- '--generate-notes' /tmp/gh-release-create-args
            # Explicit if/exit: a bare "! grep" is exempt from errexit, so a
            # non-final negated check would never fail the step.
            if grep -q -- '--notes-start-tag' /tmp/gh-release-create-args; then
              echo "unexpected --notes-start-tag on a first release" >&2; exit 1
            fi
            if grep -q -- '--notes-file' /tmp/gh-release-create-args; then
              echo "unexpected --notes-file on a first release" >&2; exit 1
            fi
  # Exercises resolve_previous_deploy_tag against a disposable local git
  # history instead of this orb repo's own history, so the test never
  # depends on (or perturbs) real tags.
  test_resolve_previous_deploy_tag:
    executor: configurations/base_pinned
    working_directory: /tmp/resolve-prev-tag-test
    steps:
      - run:
          name: Build a temporary release history (root, c1 tagged, c2 tagged/release)
          command: |
            set -euo pipefail
            git init -q
            git config user.name "Test User"
            git config user.email "test@example.com"
            git config commit.gpgsign false
            git config tag.gpgsign false
            echo root >> file.txt && git add file.txt && git commit -q -m root
            echo c1 >> file.txt && git add file.txt && git commit -q -m c1
            git tag "2026.01.01-aaaaaaa"
            echo c2 >> file.txt && git add file.txt && git commit -q -m c2
            git tag "2026.01.01-bbbbbbb"
            echo 'export RELEASE_TAG="2026.01.01-bbbbbbb"' >> "$BASH_ENV"
      - configurations/resolve_previous_deploy_tag
      - run:
          name: Assert PREV_RELEASE_TAG was resolved to the true previous release
          command: |
            if [ "${PREV_RELEASE_TAG:-}" != "2026.01.01-aaaaaaa" ]; then
              echo "expected PREV_RELEASE_TAG=2026.01.01-aaaaaaa, got '${PREV_RELEASE_TAG:-<unset>}'" >&2
              exit 1
            fi
            echo "PREV_RELEASE_TAG correctly resolved to ${PREV_RELEASE_TAG}"
  test_generate_release_notes_from_deploy_diff:
    # Exercises the non-blocking fallback path (no CircleCI API token
    # available), since that is the only path exercisable without live
    # Deploy Diff Summaries API access from this test job.
    executor: configurations/base_pinned
    steps:
      - checkout
      - configurations/generate_release_notes_from_deploy_diff:
          # Point at an env var that is never set, so the command always
          # falls back regardless of whether CIRCLE_TOKEN happens to be
          # present in this job's environment.
          circle_token_env: NONEXISTENT_CIRCLE_TOKEN
      - run:
          name: Assert non-blocking fallback to gh --generate-notes
          command: |
            if [ "${RELEASE_NOTES_SOURCE:-}" != "gh-generate-notes" ]; then
              echo "Expected RELEASE_NOTES_SOURCE=gh-generate-notes, got '${RELEASE_NOTES_SOURCE:-<unset>}'" >&2
              exit 1
            fi
            echo "OK: RELEASE_NOTES_SOURCE=gh-generate-notes (non-blocking fallback confirmed)"
      - run:
          name: Assert the command installed the standalone CircleCI CLI
          command: circleci api --help >/dev/null
  # Exercises npm_publish_oidc end-to-end with a real (unstubbed) OIDC token
  # request, without ever calling the real `npm publish`: publish_command is
  # overridden to a harmless echo so no package is actually published.
  # CircleCI only mints OIDC tokens for jobs that use a context, so the
  # workflow entry runs this job with the `circleci` context; without one the
  # command's fail-fast path would exit 1 and block every publish job that
  # requires this test. The empty-token and publish_command paths are
  # covered deterministically by src/tests/npm_publish_oidc.bats.
  test_npm_publish_oidc:
    executor: configurations/base_pinned
    steps:
      - checkout
      - configurations/npm_publish_oidc:
          publish_command: "echo publish-called"
  # Exercises with_deploy_marker end to end: plan -> RUNNING -> steps ->
  # SUCCESS against a real "orb-test" component in the "ci-validation"
  # environment. This does create a real deploy marker in this orb repo's
  # own CircleCI Deploys history, same as the source repo's own CI does for
  # its production deploys -- there is no side-effect-free way to exercise
  # `circleci run release ...` itself, so the wrapped step is a harmless
  # echo instead of a real deployment.
  test_with_deploy_marker:
    executor: configurations/base_pinned
    steps:
      - checkout
      - configurations/with_deploy_marker:
          environment_name: ci-validation
          component_name: orb-test
          steps:
            - run:
                name: Simulated deploy
                command: echo "deploying orb-test to ci-validation"
  test_skip_unless_changed:
    # Exercises the command's "continue" path against this checkout's real
    # git history: base_revision is left empty (mirrors a GitHub App
    # pipeline where pipeline.git.base_revision resolves empty) so the
    # command falls back to fallback=parent_commit (HEAD^1), then halts
    # unless a src/ path changed between HEAD^1 and HEAD. Every PR touching
    # this command touches src/, so this exercises the non-halt branch on
    # real data; the halt branch is covered by BATS against a stubbed
    # circleci-agent (halting here would also make the job report success,
    # so it cannot itself prove a halt happened).
    executor: configurations/base_pinned
    steps:
      - checkout
      - configurations/skip_unless_changed:
          base_revision: ""
          fallback: parent_commit
          mode: skip_unless_matches
          pattern: '^src/'
      - run:
          name: Confirm this step ran (job was not halted)
          command: echo "skip_unless_changed continued past the skip check as expected"
  # Exercises configurations/resolve_deploy_tag end to end against a local git
  # fixture repo (its own bare "origin" remote, never a real one), so
  # `git fetch --tags --force origin` and `git tag --points-at` run for real
  # without any external network side effects.
  test_resolve_deploy_tag:
    executor: configurations/base_pinned
    working_directory: /tmp/resolve-deploy-tag-fixture
    steps:
      - run:
          name: Build a local git fixture repo with a deploy tag on HEAD
          command: |
            REMOTE_DIR="$(mktemp -d)"
            git init --quiet --bare "$REMOTE_DIR"
            git init --quiet .
            git config user.email "test@example.com"
            git config user.name "Test"
            git remote add origin "$REMOTE_DIR"
            echo hello > file.txt
            git add file.txt
            git commit --quiet -m "test commit"
            git tag 2026.09.03-abcdef0
            git push --quiet origin HEAD:main --tags
            echo "export RESOLVE_TAG_TEST_SHA=\"$(git rev-parse HEAD)\"" >> "$BASH_ENV"
      - configurations/resolve_deploy_tag:
          commit: "$RESOLVE_TAG_TEST_SHA"
          # Do not halt on a miss here: a regression that fails to pick the
          # fixture tag must reach the assertion below and fail, instead of
          # ending the job successfully via step halt.
          halt_if_missing: false
      - run:
          name: Assert RELEASE_TAG was exported with the expected value
          command: |
            if [ "${RELEASE_TAG:-}" != "2026.09.03-abcdef0" ]; then
              echo "Expected RELEASE_TAG=2026.09.03-abcdef0, got '${RELEASE_TAG:-<unset>}'"
              exit 1
            fi
            echo "RELEASE_TAG resolved correctly: $RELEASE_TAG"
  # Exercises the default halt_if_missing (true) on a commit with no deploy
  # tag, through the real orb parameter pipeline: CircleCI decides how the
  # boolean is rendered into the step's environment, which unit tests cannot
  # reproduce. If the command does not halt, the next step runs and fails.
  test_resolve_deploy_tag_halts_without_tag:
    executor: configurations/base_pinned
    working_directory: /tmp/resolve-deploy-tag-missing-fixture
    steps:
      - run:
          name: Build a local git fixture repo with no tag on HEAD
          command: |
            REMOTE_DIR="$(mktemp -d)"
            git init --quiet --bare "$REMOTE_DIR"
            git init --quiet .
            git config user.email "test@example.com"
            git config user.name "Test"
            git remote add origin "$REMOTE_DIR"
            echo hello > file.txt
            git add file.txt
            git commit --quiet -m "test commit"
            git push --quiet origin HEAD:main
            echo "export RESOLVE_TAG_TEST_SHA=\"$(git rev-parse HEAD)\"" >> "$BASH_ENV"
      - configurations/resolve_deploy_tag:
          commit: "$RESOLVE_TAG_TEST_SHA"
      - run:
          name: Fail if the missing tag did not halt the job
          command: |
            echo "resolve_deploy_tag did not halt although no tag matched (halt_if_missing defaults to true)"
            exit 1
  test_push_deploy_tag:
    # Exercises the push_deploy_tag command against a throwaway local bare
    # git remote (never a real upstream), covering both the "no tag yet"
    # create path and the "tag already exists" skip path in one job.
    executor: configurations/base_pinned
    working_directory: /tmp/push_deploy_tag_test
    steps:
      - run:
          name: Set up a local bare remote and seed a commit
          command: |
            set -euo pipefail
            git init --bare /tmp/push_deploy_tag_remote.git
            git clone /tmp/push_deploy_tag_remote.git .
            git config user.email "orb-test@example.com"
            git config user.name "Orb Test"
            git commit --allow-empty -m "seed commit"
            git push origin HEAD:main
            echo "export CIRCLE_SHA1=$(git rev-parse HEAD)" >> "$BASH_ENV"
            # Fix the tag's date once for the whole job. Re-evaluating
            # "date -u" in each step would make the job flaky across a UTC
            # midnight: the verify step could look for a different date than
            # the command used, and the second run could create a new tag
            # instead of exercising the skip path. date_format below is the
            # env var reference, which the command expands via
            # "circleci env subst" into a literal (no % specifiers) date.
            echo "export FIXTURE_DATE=$(date -u +%Y.%m.%d)" >> "$BASH_ENV"
      - configurations/push_deploy_tag:
          date_format: "${FIXTURE_DATE}"
          sha_length: 7
      - run:
          name: Verify the tag was created and pushed to the local remote
          command: |
            set -euo pipefail
            TAG="${FIXTURE_DATE}-${CIRCLE_SHA1:0:7}"
            git ls-remote --tags origin "$TAG" | grep -q "$TAG"
      - configurations/push_deploy_tag:
          date_format: "${FIXTURE_DATE}"
          sha_length: 7
      - run:
          name: Verify a second run hits the skip path without erroring
          command: |
            set -euo pipefail
            TAG="${FIXTURE_DATE}-${CIRCLE_SHA1:0:7}"
            COUNT="$(git ls-remote --tags origin | grep -c "$TAG")"
            [ "$COUNT" -eq 1 ]
  test_cdk_synth:
    # No checkout: this job only exercises the command against a throwaway
    # fixture, not the orb repo itself.
    executor:
      name: node/default
      tag: "22.14"
    working_directory: /tmp/cdk-synth-fixture
    steps:
      - run:
          name: Write a minimal CDK-app-shaped fixture (synth script reports CDK_DEFAULT_* env)
          command: |
            mkdir -p /tmp/cdk-synth-fixture
            # CircleCI config v2.1 treats a doubled angle-bracket sequence as
            # parameter/pipeline-value syntax, so a literal heredoc start
            # here must be backslash-escaped, or the config fails to
            # compile with an "Unclosed tag" error. `circleci config
            # process` strips that escaping backslash before the shell ever
            # sees this line, so the heredoc below still runs correctly.
            cat > package.json \<<'PKGJSON'
            {
              "name": "cdk-synth-fixture",
              "private": true,
              "packageManager": "pnpm@10.34.9",
              "scripts": {
                "synth": "env | grep '^CDK_DEFAULT_' | sort > synth-output.txt"
              }
            }
            PKGJSON
      # packageManager above pins the pnpm that corepack provisions. Without
      # it corepack fetches the newest pnpm, and pnpm 12 dropped the
      # bin/pnpm.cjs entry point that Node 22.14's bundled corepack loads.
      - run:
          name: Enable pnpm via corepack
          command: corepack enable pnpm
      - configurations/cdk_synth:
          pkg_manager: pnpm
          synth_script: synth
      - run:
          name: Confirm the account/region placeholders were applied
          command: |
            cat synth-output.txt
            grep -qx 'CDK_DEFAULT_ACCOUNT=123456789012' synth-output.txt
            grep -qx 'CDK_DEFAULT_REGION=us-east-1' synth-output.txt
workflows:
  test-deploy:
    jobs:
      # Make sure to include "filters: *filters" in every test job you want to run as part of your deployment.
      # Test your orb's commands in a custom job and test your orb's jobs directly as a part of this workflow.
      - test_base_pinned_executor:
          filters: *filters
      - test_trivy_executor:
          filters: *filters
      - test_dependency_audit:
          filters: *filters
      - test_cdk_synth:
          filters: *filters
      - test_push_deploy_tag:
          filters: *filters
      - test_resolve_deploy_tag:
          filters: *filters
      - test_resolve_deploy_tag_halts_without_tag:
          filters: *filters
      - test_skip_unless_changed:
          filters: *filters
      - test_with_deploy_marker:
          filters: *filters
      - test_npm_publish_oidc:
          context: circleci
          filters: *filters
      # Runs the npm_semantic_release job end to end on a fixture package
      # (.circleci/fixtures/npm-semantic-release, private, never published):
      # skip-ci check, preflight, npm ci, build, pinned semantic-release
      # install, then npm_publish_oidc with a release_command that only
      # checks NPM_ID_TOKEN is set and that the pinned semantic-release
      # starts. Nothing is released or published. The circleci context lets
      # CircleCI mint the OIDC token (as for test_npm_publish_oidc);
      # GITHUB_TOKEN is a dummy because no GitHub API is called.
      - configurations/npm_semantic_release:
          name: test_npm_semantic_release
          context: circleci
          app_dir: .circleci/fixtures/npm-semantic-release
          pkg_manager: npm
          resource_class: small
          release_command: 'node -e "process.exit(process.env.NPM_ID_TOKEN ? 0 : 1)" && semantic-release --version'
          pre-steps:
            - run:
                name: Set a dummy GITHUB_TOKEN for the preflight check
                command: echo 'export GITHUB_TOKEN=test-dummy-not-a-token' >> "$BASH_ENV"
          filters: *filters
      - test_generate_release_notes_from_deploy_diff:
          filters: *filters
      - test_resolve_previous_deploy_tag:
          filters: *filters
      - test_create_github_release:
          filters: *filters
      - test_install_cdkd:
          filters: *filters
      # Runs the github_release_from_deploy_tag job itself on this orb repo's
      # own commit. The orb repo is tagged v<semver>, never YYYY.MM.DD-<sha7>,
      # so resolve_deploy_tag finds no deploy tag and halts the job before
      # gh/setup: no context or GitHub token is needed and no Release can be
      # created. This proves the job compiles and starts on its default
      # executor; the release path itself is covered by the command tests
      # above and src/tests/halt_if_github_release_exists.bats.
      - configurations/github_release_from_deploy_tag:
          name: test_github_release_from_deploy_tag_halts_without_tag
          filters: *filters
      # The orb must be re-packed for publishing, and saved to the workspace.
      - orb-tools/pack:
          filters: *filters
      # Dev orb for this pull request's head commit. The release pipeline
      # replaces this entry with the production release (see
      # .circleci/release-workflow.yml), so every other job listed here also
      # gates the release.
      - orb-tools/publish:
          name: publish-dev
          orb_name: hideokamoto/configurations
          vcs_type: << pipeline.project.type >>
          pub_type: dev
          dev_tags: dev:${CIRCLE_SHA1}
          requires:
            - orb-tools/pack
            - test_base_pinned_executor
            - test_trivy_executor
            - test_dependency_audit
            - test_install_cdkd
            - test_github_release_from_deploy_tag_halts_without_tag
            - test_create_github_release
            - test_resolve_previous_deploy_tag
            - test_generate_release_notes_from_deploy_diff
            - test_with_deploy_marker
            - test_skip_unless_changed
            - test_resolve_deploy_tag
            - test_resolve_deploy_tag_halts_without_tag
            - test_push_deploy_tag
            - test_cdk_synth
            - test_npm_publish_oidc
            - test_npm_semantic_release
          context: circleci
          filters: *filters
