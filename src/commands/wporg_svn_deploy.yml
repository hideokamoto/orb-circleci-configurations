description: >
  Publishes a built WordPress plugin directory to its WordPress.org plugin
  SVN repository: the directory's contents become trunk/, trunk is copied to
  tags/<version>, an optional assets directory is synced into assets/, and
  all of it goes up in one `svn commit`. The flow follows 10up's
  action-wordpress-plugin-deploy (checkout with --depth immediates, rsync
  --delete into trunk, svn add / svn rm, svn cp trunk tags/<version>, image
  mime types on assets), written as an orb command so the shared WordPress
  plugin release template can use it without a third-party orb or action.

  What it deploys is `build_dir` as given. It does not build or filter
  anything, so pass the same tree that was attached to the GitHub Release
  (for example the unzipped release zip), and every file in it is published,
  including ones svn's default global-ignores would skip.

  Checks before anything is written: the plugin header `Version:` in
  `main_file` and the readme's `Stable tag:` must both equal the release
  version, because WordPress.org serves the version that trunk's Stable tag
  names. A mismatch fails the step instead of publishing a tag that is not
  served, or serving the wrong one.

  Reruns and out-of-order jobs are safe. specs/wporg_svn_deploy.qnt models
  the command against release pipelines whose deploy jobs interleave, fail,
  lose the commit's response and are rerun, and CI model-checks it.
  - tags/<version> already exists: trunk and the tag are committed
    together, so the version is already published; exit 0 without
    committing.
  - trunk's Stable tag is newer than the version (an older pipeline's job
    ran or was rerun after a newer one): exit 0 without committing, so
    trunk never moves back to an older version.
  - tags/<version> exists but trunk's Stable tag is older: the tag was not
    made by this command, and WordPress.org does not serve it; fail.
  Versions are compared with `sort -V`, which matches PHP's version_compare
  for plain X.Y.Z versions.

  Credentials: the user name and password are read from the env vars named
  by `username_env` / `password_env` (put them in a context that only the
  deploy job uses). The password is passed to svn with --password-from-stdin
  and --no-auth-cache, so it never appears on a command line, in the job
  output, or in an svn auth cache. `dry_run` runs every step up to the
  commit and needs no credentials.

  Plugins that have release confirmation turned on stay pending after the
  commit until the release is approved from the email WordPress.org sends.

  subversion and rsync are installed with apt-get when missing (cimg/base
  ships neither).

parameters:
  slug:
    type: string
    description: >
      The plugin's WordPress.org slug (lowercase letters, digits, hyphens).
      Used for the default svn_url and the default main_file.
  build_dir:
    type: string
    description: >
      Directory whose contents become trunk/. Files in trunk/ that are not in
      this directory are deleted.
  main_file:
    type: string
    default: ""
    description: >
      Main plugin file, relative to build_dir, whose header `Version:` is
      checked. Empty means "<slug>.php".
  assets_dir:
    type: string
    default: ""
    description: >
      Directory synced into the repository's top-level assets/ (banners,
      icons, screenshots). Empty leaves assets/ untouched; a path that does
      not exist is reported and also leaves assets/ untouched.
  version_env:
    type: env_var_name
    default: RELEASE_VERSION
    description: >
      Env var holding the version to publish. A leading "v" is dropped, so a
      git tag such as "v1.2.3" works. The default matches the variable the
      WordPress plugin release template in circleci-configurations exports.
  username_env:
    type: env_var_name
    default: SVN_USERNAME
    description: Env var holding the WordPress.org SVN user name.
  password_env:
    type: env_var_name
    default: SVN_PASSWORD
    description: >
      Env var holding the WordPress.org SVN password. It is only ever written
      to svn's stdin.
  svn_url:
    type: string
    default: ""
    description: >
      Repository URL. Empty means https://plugins.svn.wordpress.org/<slug>/.
      Mainly for tests against a local file:// repository.
  dry_run:
    type: boolean
    default: false
    description: >
      Run the checkout, sync and `svn status`, then stop without committing.
      Credentials are not required.

steps:
  - run:
      name: Deploy to the WordPress.org plugin SVN repository
      environment:
        PARAM_SLUG: <<parameters.slug>>
        PARAM_BUILD_DIR: <<parameters.build_dir>>
        PARAM_MAIN_FILE: <<parameters.main_file>>
        PARAM_ASSETS_DIR: <<parameters.assets_dir>>
        PARAM_VERSION_ENV: <<parameters.version_env>>
        PARAM_USERNAME_ENV: <<parameters.username_env>>
        PARAM_PASSWORD_ENV: <<parameters.password_env>>
        PARAM_SVN_URL: <<parameters.svn_url>>
        PARAM_DRY_RUN: <<parameters.dry_run>>
      command: <<include(scripts/wporg_svn_deploy.sh)>>
