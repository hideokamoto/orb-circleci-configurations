version: 2.1
orbs:
  # Your orb will be automatically injected here during the pipeline.
  # Reference your orb's jobs and commands below as they will exist when built.
  orb-tools: circleci/orb-tools@12.3
  # The orb definition is intentionally not included here. It will be injected into the pipeline.
  configurations: {}

# Use this tag to ensure test jobs always run,
# even though the downstream publish job will only run on release tags.
filters: &filters
  tags:
    only: /.*/

# Filter for release tags.
release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

jobs:
  # Exercise the orb's executors directly, so a packaging or parameter
  # regression in either one fails test-deploy before publish.
  test_base_pinned_executor:
    executor: configurations/base_pinned
    steps:
      - checkout
      - run:
          name: Confirm base_pinned resolves to a cimg/base image
          command: cat /etc/os-release | head -2
      - run:
          # cimg/base does not ship the `circleci` CLI on PATH. What the
          # deploy-marker commands actually depend on is the build-agent
          # CLI CircleCI injects into every job at /usr/bin/circleci (see
          # the migration source's .circleci/continue-config.yml and
          # workflows/deployment/cloudflare-workers.yaml, both of which
          # call it by full path on cimg-family images in production).
          # Check that full path instead of PATH resolution, plus a
          # baseline tool (git) that base_pinned jobs also rely on.
          name: Confirm build-agent circleci CLI and git are present
          command: |
            test -x /usr/bin/circleci
            git --version
  test_trivy_executor:
    executor: configurations/trivy
    steps:
      - checkout
      - run:
          name: Confirm trivy resolves to a working Trivy image
          command: trivy --version
  # Exercises the create_github_release command end-to-end without ever
  # creating a real GitHub Release: a `gh` stub is installed at the front
  # of PATH before the command runs, so `gh release view` / `gh release
  # create` never leave this job. RELEASE_TAG is set at the job level so
  # the command's default tag_env (RELEASE_TAG) resolves it; no
  # RELEASE_NOTES_SOURCE / PREV_RELEASE_TAG is set, so this drives the
  # command's first-release branch (--generate-notes, no start tag).
  # skip_if_exists's halt path and the two other release-notes branches
  # are covered by src/tests/create_github_release.bats.
  test_create_github_release:
    executor: configurations/base_pinned
    environment:
      RELEASE_TAG: "2026.09.03-0000000"
    steps:
      - checkout
      - run:
          name: Install a gh stub ahead of PATH (no real Release is ever created)
          command: |
            mkdir -p /tmp/gh-stub-bin
            {
              echo '#!/usr/bin/env bash'
              echo 'if [ "$1" = "release" ] && [ "$2" = "view" ]; then'
              echo '  echo "gh stub: release view $3 -> not found" >&2'
              echo '  exit 1'
              echo 'fi'
              echo 'if [ "$1" = "release" ] && [ "$2" = "create" ]; then'
              echo '  echo "gh stub: release create called with: $*" >&2'
              echo '  echo "$*" > /tmp/gh-release-create-args'
              echo '  exit 0'
              echo 'fi'
              echo 'echo "gh stub: unexpected invocation: $*" >&2'
              echo 'exit 1'
            } > /tmp/gh-stub-bin/gh
            chmod +x /tmp/gh-stub-bin/gh
            echo 'export PATH="/tmp/gh-stub-bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Confirm the stubbed gh (not a real gh binary) is first on PATH
          command: |
            command -v gh
            [ "$(command -v gh)" = "/tmp/gh-stub-bin/gh" ]
      - configurations/create_github_release:
          skip_if_exists: false
      - run:
          name: Assert the stub recorded a first-release "gh release create --generate-notes"
          command: |
            test -f /tmp/gh-release-create-args
            grep -q -- '--generate-notes' /tmp/gh-release-create-args
            ! grep -q -- '--notes-start-tag' /tmp/gh-release-create-args
            ! grep -q -- '--notes-file' /tmp/gh-release-create-args
workflows:
  test-deploy:
    jobs:
      # Make sure to include "filters: *filters" in every test job you want to run as part of your deployment.
      # Test your orb's commands in a custom job and test your orb's jobs directly as a part of this workflow.
      - test_base_pinned_executor:
          filters: *filters
      - test_trivy_executor:
          filters: *filters
      - test_create_github_release:
          filters: *filters
      # The orb must be re-packed for publishing, and saved to the workspace.
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: hideokamoto/configurations
          vcs_type: << pipeline.project.type >>
          pub_type: production
          # Ensure this job requires all test jobs and the pack job.
          requires:
            - orb-tools/pack
            - test_base_pinned_executor
            - test_trivy_executor
            - test_create_github_release
          context: orb-publishing
          filters: *release-filters
