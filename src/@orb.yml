version: 2.1

description: >
  Shared CI/CD building blocks for CircleCI pipelines: deploy markers around
  release commands, path-based skip logic for change-gated jobs, npm publish
  over OIDC (no static npm tokens), AWS CDK and Cloudflare Workers deploy
  helpers, GitHub Release automation driven by deploy tags, AI-DLC config
  validation, and SBOM generation with Trivy for supply-chain visibility.
  Components are added incrementally; see the README for current coverage.

display:
  home_url: "https://github.com/hideokamoto/orb-circleci-configurations#readme"
  source_url: "https://github.com/hideokamoto/orb-circleci-configurations"

orbs:
  node: circleci/node@7.2.1
  aws-cli: circleci/aws-cli@5.4.2
  gh: circleci/github-cli@2.7.2
