version: 2.1
orbs:
  # Your orb will be automatically injected here during the pipeline.
  # Reference your orb's jobs and commands below as they will exist when built.
  orb-tools: circleci/orb-tools@12.3
  # The orb definition is intentionally not included here. It will be injected into the pipeline.
  configurations: {}

# Test jobs run on every branch and on tags. Tags no longer trigger a
# release (see the release job); the v* tags that release pushes simply get
# the same tests run against them.
filters: &filters
  tags:
    only: /.*/

jobs:
  # Exercise the orb's executors directly, so a packaging or parameter
  # regression in either one fails test-deploy before publish.
  test_base_pinned_executor:
    executor: configurations/base_pinned
    steps:
      - checkout
      - run:
          name: Confirm base_pinned resolves to a cimg/base image
          command: cat /etc/os-release | head -2
      - run:
          # cimg/base does not ship the `circleci` CLI on PATH. What the
          # deploy-marker commands actually depend on is the build-agent
          # CLI CircleCI injects into every job at /usr/bin/circleci (see
          # the migration source's .circleci/continue-config.yml and
          # workflows/deployment/cloudflare-workers.yaml, both of which
          # call it by full path on cimg-family images in production).
          # Check that full path instead of PATH resolution, plus a
          # baseline tool (git) that base_pinned jobs also rely on.
          name: Confirm build-agent circleci CLI and git are present
          command: |
            test -x /usr/bin/circleci
            git --version
  test_trivy_executor:
    executor: configurations/trivy
    steps:
      - checkout
      - run:
          name: Confirm trivy resolves to a working Trivy image
          command: trivy --version
  # Exercise the dependency_audit scripts and the audit_deps command without
  # real credentials: a stubbed `pnpm` stands in for the package manager, and
  # the Chunk fix script is run through its "skip without tokens" path.
  test_dependency_audit:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: Prepare a stubbed pnpm fixture
          command: |
            mkdir -p "$HOME/stubbin"
            printf '#!/usr/bin/env bash\necho "[stub] $0 $*"\nexit 0\n' > "$HOME/stubbin/pnpm"
            chmod +x "$HOME/stubbin/pnpm"
            printf 'export PATH="$HOME/stubbin:$PATH"\n' >> "$BASH_ENV"
            printf '{"name":"fixture","packageManager":"pnpm@10.0.0"}\n' > package.json
            touch pnpm-lock.yaml
      # Runs src/scripts/audit_deps.sh through the packed orb: must detect
      # pnpm from the fixture lockfile and invoke the stubbed `pnpm audit`.
      - configurations/audit_deps:
          audit_level: high
      - run:
          name: chunk_audit_fix.sh skips when tokens are absent
          command: |
            unset CIRCLE_TOKEN GITHUB_TOKEN
            bash src/scripts/chunk_audit_fix.sh
            grep -q 'CHUNK_AUDIT_FIX_SUMMARY' "$BASH_ENV"
  # Production release on every push to main. Nothing has to push a tag or
  # create a GitHub Release to trigger it, so a merge made by a person or by
  # an AI coding agent releases the same way. Mirrors the semantic-release
  # flow in circleci-configurations' workflows/publish/*-semantic-release.yaml,
  # with `circleci orb publish` in place of npm publish (see .releaserc.json):
  #   1. Next version from the Conventional Commits since the last v* tag
  #      (feat -> minor, fix/perf -> patch, `!`/BREAKING CHANGE -> major).
  #      docs/chore/ci/test/refactor-only merges release nothing.
  #   2. verifyConditions (before anything is created): the packed orb is
  #      present and valid, CIRCLE_TOKEN is set, and GITHUB_TOKEN can push.
  #   3. prepare: publish hideokamoto/configurations@<version> to the orb
  #      registry. Done before the tag on purpose: if publishing fails, no
  #      tag exists yet, so re-running the job retries the same version.
  #   4. Push the v<version> tag, then create the GitHub Release (a record of
  #      what was published; neither triggers anything).
  # With no v* tag in history yet, semantic-release's first release is 1.0.0.
  release:
    docker:
      # Node 24 satisfies semantic-release 25's engine requirement.
      - image: cimg/node:24.22
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: dist
      - run:
          name: Check prerequisites
          command: |
            set -euo pipefail
            if [ -z "${GITHUB_TOKEN:-}" ]; then
              echo "GITHUB_TOKEN is required in the github context." >&2
              exit 1
            fi
            if [ -z "${CIRCLE_TOKEN:-}" ]; then
              echo "CIRCLE_TOKEN (orb publishing) is required in the circleci context." >&2
              exit 1
            fi
            # semantic-release finds the previous release from tags.
            git fetch --tags origin
      - run:
          name: Unpack the tested orb from orb-tools/pack
          command: |
            set -euo pipefail
            # orb-tools/pack persists dist/ as a single tarball.
            tar -xzf dist/orb_source.tar.gz -C dist
            rm dist/orb_source.tar.gz
            test -s dist/orb.yml
      - run:
          name: Install the standalone CircleCI CLI (sha256-pinned)
          command: |
            set -euo pipefail
            # /usr/bin/circleci on cimg images is the build-agent binary, which
            # has no `orb publish`. Same pinned release as this orb's
            # install_circleci_cli command; installed ahead of /usr/bin on PATH.
            version="1.0.49308"
            sha256="1beeaddd7f5652612bfd9a8a0a303bb966fb69a355d7bb9d036d537f8f9e8b17"
            tmp_dir="$(mktemp -d)"
            curl -fLSs --connect-timeout 10 --max-time 120 -o "${tmp_dir}/cli.tar.gz" \
              "https://github.com/CircleCI-Public/circleci-cli/releases/download/v${version}/circleci-cli_${version}_linux_amd64.tar.gz"
            echo "${sha256}  ${tmp_dir}/cli.tar.gz" | sha256sum -c -
            tar -xzf "${tmp_dir}/cli.tar.gz" -C "${tmp_dir}" circleci
            sudo install -m 0755 "${tmp_dir}/circleci" /usr/local/bin/circleci
            rm -rf "${tmp_dir}"
            circleci version
      - run:
          name: Install release tools (without lifecycle scripts)
          command: |
            set -euo pipefail
            # Pinned: these tools receive a contents:write token and the orb
            # publishing token. Versions match circleci-configurations'
            # semantic-release templates, plus @semantic-release/exec.
            npm install --prefix "${HOME}/release-tools" --ignore-scripts --no-audit --no-fund \
              semantic-release@25.0.9 \
              conventional-changelog-conventionalcommits@9.3.1 \
              @semantic-release/exec@7.1.0
      - run:
          name: Release with semantic-release
          command: |
            set -euo pipefail
            "${HOME}/release-tools/node_modules/.bin/semantic-release"
  # Exercises skip_if_release_commit on the ordinary (non-release,
  # non-skip-marker) commit that CI itself runs on, so the non-halting
  # path is covered end-to-end. The halting paths are covered by
  # src/tests/skip_if_release_commit.bats against a synthetic git history.
  test_skip_if_release_commit:
    executor: configurations/base_pinned
    steps:
      - checkout
      - configurations/skip_if_release_commit
      - run:
          name: Confirm the job was not halted
          command: echo "skip_if_release_commit did not halt this job, as expected"
workflows:
  test-deploy:
    jobs:
      # Make sure to include "filters: *filters" in every test job you want to run as part of your deployment.
      # Test your orb's commands in a custom job and test your orb's jobs directly as a part of this workflow.
      - test_base_pinned_executor:
          filters: *filters
      - test_trivy_executor:
          filters: *filters
      - test_dependency_audit:
          filters: *filters
      - test_skip_if_release_commit:
          filters: *filters
      # The orb must be re-packed for publishing, and saved to the workspace.
      - orb-tools/pack:
          filters: *filters
      # Dev orbs. dev:alpha is consumed by real pipelines, so only main may
      # move it; every other branch publishes an immutable-per-commit
      # dev:<SHA1> label instead, so an unreviewed PR build can never change
      # what dev:alpha consumers run.
      - orb-tools/publish:
          name: publish-dev-main
          orb_name: hideokamoto/configurations
          vcs_type: << pipeline.project.type >>
          pub_type: dev
          dev_tags: dev:${CIRCLE_SHA1},dev:alpha
          requires:
            - orb-tools/pack
            - test_base_pinned_executor
            - test_trivy_executor
            - test_dependency_audit
            - test_skip_if_release_commit
          context: circleci
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
      - orb-tools/publish:
          name: publish-dev-branch
          orb_name: hideokamoto/configurations
          vcs_type: << pipeline.project.type >>
          pub_type: dev
          dev_tags: dev:${CIRCLE_SHA1}
          requires:
            - orb-tools/pack
            - test_base_pinned_executor
            - test_trivy_executor
            - test_dependency_audit
            - test_skip_if_release_commit
          context: circleci
          filters:
            branches:
              ignore: main
            tags:
              ignore: /.*/
      # Production orbs: released by semantic-release on every push to main
      # (see the release job above). Requires every test job and the pack.
      - release:
          requires:
            - orb-tools/pack
            - test_base_pinned_executor
            - test_trivy_executor
            - test_dependency_audit
            - test_skip_if_release_commit
          context:
            - circleci
            - github
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
          serial-group: << pipeline.project.slug >>/release
