description: >
  Idempotently create a GitHub Release for the deploy tag left by
  resolve_deploy_tag. Migrated from cloudflare-workers.yaml's
  "Skip if release already exists (idempotent retry)" and "Create GitHub
  Release" steps in the create-github-release job: a retried job or
  workflow run must never fail or double-create a release for a tag that
  already has one, and release notes are sourced from Deploy Diff
  Summaries when available, falling back to gh's own --generate-notes
  (with --notes-start-tag once a previous release exists, or without it
  for the very first release). Requires gh/setup (contents:write) to have
  already run.

parameters:
  tag_env:
    type: env_var_name
    default: RELEASE_TAG
    description: >
      Name of the environment variable holding the release tag to create,
      as set by resolve_deploy_tag.
  prev_tag_env:
    type: env_var_name
    default: PREV_RELEASE_TAG
    description: >
      Name of the environment variable holding the previous release tag,
      as set by resolve_previous_deploy_tag. Empty or unset selects the
      first-release branch (gh release create --generate-notes with no
      --notes-start-tag).
  notes_source_env:
    type: env_var_name
    default: RELEASE_NOTES_SOURCE
    description: >
      Name of the environment variable selecting the release notes
      source, as set by generate_release_notes_from_deploy_diff. When its
      value is "deploy-diff-summaries" the file named by notes_file_env is
      used; any other value (including unset) falls back to gh's own
      --generate-notes.
  notes_file_env:
    type: env_var_name
    default: RELEASE_NOTES_FILE
    description: >
      Name of the environment variable holding the path to the generated
      release notes file, as set by generate_release_notes_from_deploy_diff.
      Read only when notes_source_env resolves to "deploy-diff-summaries".
  skip_if_exists:
    type: boolean
    default: true
    description: >
      When true, check `gh release view <tag>` first and halt the step
      (without failing the job) if a release for the tag already exists,
      so a retried job or workflow run is a safe no-op instead of an
      error.

steps:
  - run:
      name: Create GitHub release (idempotent)
      environment:
        PARAM_TAG_ENV: <<parameters.tag_env>>
        PARAM_PREV_TAG_ENV: <<parameters.prev_tag_env>>
        PARAM_NOTES_SOURCE_ENV: <<parameters.notes_source_env>>
        PARAM_NOTES_FILE_ENV: <<parameters.notes_file_env>>
        PARAM_SKIP_IF_EXISTS: <<parameters.skip_if_exists>>
      command: <<include(scripts/create_github_release.sh)>>
