version: 2.1
orbs:
  # Your orb will be automatically injected here during the pipeline.
  # Reference your orb's jobs and commands below as they will exist when built.
  orb-tools: circleci/orb-tools@12.3
  # The orb definition is intentionally not included here. It will be injected into the pipeline.
  configurations: {}
  node: circleci/node@7.2.1

# This continuation is the single definition of the orb's integration test
# jobs. The ci pipeline (pull request events only) runs it as-is and ends in
# a dev:<SHA1> publish. The release pipeline (pushes to main) reuses the same
# jobs: .circleci/scripts/build-release-config.sh takes this file, drops the
# dev publish below, and adds the release job from release-workflow.yml.
# Neither pipeline runs on tags; the anchor only keeps job entries uniform.
filters: &filters
  tags:
    only: /.*/

# The cdkd version test_install_cdkd expects the install_cdkd command to
# install by default. It must equal the command's default `version`
# parameter (src/commands/install_cdkd.yml); the test fails if they drift.
cdkd-test-version: &cdkd_test_version "0.280.15"

jobs:
  # Exercise the orb's executors directly, so a packaging or parameter
  # regression in either one fails test-deploy before publish.
  test_base_pinned_executor:
    executor: configurations/base_pinned
    steps:
      - checkout
      - run:
          name: Confirm base_pinned resolves to a cimg/base image
          command: cat /etc/os-release | head -2
      - run:
          # cimg/base does not ship the `circleci` CLI on PATH. What the
          # deploy-marker commands actually depend on is the build-agent
          # CLI CircleCI injects into every job at /usr/bin/circleci (see
          # the migration source's .circleci/continue-config.yml and
          # workflows/deployment/cloudflare-workers.yaml, both of which
          # call it by full path on cimg-family images in production).
          # Check that full path instead of PATH resolution, plus a
          # baseline tool (git) that base_pinned jobs also rely on.
          name: Confirm build-agent circleci CLI and git are present
          command: |
            test -x /usr/bin/circleci
            git --version
  test_trivy_executor:
    executor: configurations/trivy
    steps:
      - checkout
      - run:
          name: Confirm trivy resolves to a working Trivy image
          command: trivy --version
  # Exercise the dependency_audit scripts and the audit_deps command without
  # real credentials: a stubbed `pnpm` stands in for the package manager, and
  # the Chunk fix script is run through its "skip without tokens" path.
  test_dependency_audit:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: Prepare a stubbed pnpm fixture
          command: |
            mkdir -p "$HOME/stubbin"
            printf '#!/usr/bin/env bash\necho "[stub] $0 $*"\nexit 0\n' > "$HOME/stubbin/pnpm"
            chmod +x "$HOME/stubbin/pnpm"
            printf 'export PATH="$HOME/stubbin:$PATH"\n' >> "$BASH_ENV"
            printf '{"name":"fixture","packageManager":"pnpm@10.0.0"}\n' > package.json
            touch pnpm-lock.yaml
      # Runs src/scripts/audit_deps.sh through the packed orb: must detect
      # pnpm from the fixture lockfile and invoke the stubbed `pnpm audit`.
      - configurations/audit_deps:
          audit_level: high
      - run:
          name: chunk_audit_fix.sh skips when tokens are absent
          command: |
            unset CIRCLE_TOKEN GITHUB_TOKEN
            bash src/scripts/chunk_audit_fix.sh
            grep -q 'CHUNK_AUDIT_FIX_SUMMARY' "$BASH_ENV"
  # Command-test for install_cdkd: run it with its default (pinned) version
  # -- no `version` override, so a change to the command's default that is
  # not mirrored in cdkd_test_version fails here -- and assert
  # `cdkd --version` reports exactly that version (not merely a prefix of
  # it — "0.280.150" must fail this check).
  test_install_cdkd:
    executor:
      name: node/default
      tag: "22.14"
    steps:
      - configurations/install_cdkd
      - run:
          name: Assert cdkd --version reports exactly the pinned version
          environment:
            EXPECTED_CDKD_VERSION: *cdkd_test_version
          command: |
            actual="$(cdkd --version)"
            test "${actual}" = "${EXPECTED_CDKD_VERSION}"
  test_cdk_synth:
    # No checkout: this job only exercises the command against a throwaway
    # fixture, not the orb repo itself.
    executor:
      name: node/default
      tag: "22.14"
    working_directory: /tmp/cdk-synth-fixture
    steps:
      - run:
          name: Write a minimal CDK-app-shaped fixture (synth script reports CDK_DEFAULT_* env)
          command: |
            mkdir -p /tmp/cdk-synth-fixture
            # CircleCI config v2.1 treats a doubled angle-bracket sequence as
            # parameter/pipeline-value syntax, so a literal heredoc start
            # here must be backslash-escaped, or the config fails to
            # compile with an "Unclosed tag" error. `circleci config
            # process` strips that escaping backslash before the shell ever
            # sees this line, so the heredoc below still runs correctly.
            cat > package.json \<<'PKGJSON'
            {
              "name": "cdk-synth-fixture",
              "private": true,
              "packageManager": "pnpm@10.34.9",
              "scripts": {
                "synth": "env | grep '^CDK_DEFAULT_' | sort > synth-output.txt"
              }
            }
            PKGJSON
      # packageManager above pins the pnpm that corepack provisions. Without
      # it corepack fetches the newest pnpm, and pnpm 12 dropped the
      # bin/pnpm.cjs entry point that Node 22.14's bundled corepack loads.
      - run:
          name: Enable pnpm via corepack
          command: corepack enable pnpm
      - configurations/cdk_synth:
          pkg_manager: pnpm
          synth_script: synth
      - run:
          name: Confirm the account/region placeholders were applied
          command: |
            cat synth-output.txt
            grep -qx 'CDK_DEFAULT_ACCOUNT=123456789012' synth-output.txt
            grep -qx 'CDK_DEFAULT_REGION=us-east-1' synth-output.txt
workflows:
  test-deploy:
    jobs:
      # Make sure to include "filters: *filters" in every test job you want to run as part of your deployment.
      # Test your orb's commands in a custom job and test your orb's jobs directly as a part of this workflow.
      - test_base_pinned_executor:
          filters: *filters
      - test_trivy_executor:
          filters: *filters
      - test_dependency_audit:
          filters: *filters
      - test_cdk_synth:
          filters: *filters
      - test_install_cdkd:
          filters: *filters
      # The orb must be re-packed for publishing, and saved to the workspace.
      - orb-tools/pack:
          filters: *filters
      # Dev orb for this pull request's head commit. The release pipeline
      # replaces this entry with the production release (see
      # .circleci/release-workflow.yml), so every other job listed here also
      # gates the release.
      - orb-tools/publish:
          name: publish-dev
          orb_name: hideokamoto/configurations
          vcs_type: << pipeline.project.type >>
          pub_type: dev
          dev_tags: dev:${CIRCLE_SHA1}
          requires:
            - orb-tools/pack
            - test_base_pinned_executor
            - test_trivy_executor
            - test_dependency_audit
            - test_install_cdkd
            - test_cdk_synth
          context: circleci
          filters: *filters
